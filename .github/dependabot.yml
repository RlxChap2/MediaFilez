version: 2

# Dependabot currently rejects this pnpm 11 lockfile. CI still blocks known
# high-severity production vulnerabilities through `pnpm audit`.
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: actions/checkout
        update-types:
          - version-update:semver-major
      - dependency-name: actions/setup-node
        update-types:
          - version-update:semver-major
      - dependency-name: pnpm/action-setup
        update-types:
          - version-update:semver-major
      - dependency-name: github/codeql-action
        update-types:
          - version-update:semver-major
      - dependency-name: actions/dependency-review-action
        update-types:
          - version-update:semver-major
