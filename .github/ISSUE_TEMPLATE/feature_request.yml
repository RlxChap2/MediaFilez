name: Feature request
description: Propose a focused improvement or support for a new public source.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Download engine
        - Supported site
        - Discord experience
        - Media processing
        - Metadata
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user-facing problem, not only the proposed implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This request does not require bypassing access controls or downloading private media without permission.
          required: true
