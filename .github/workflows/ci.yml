name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24]

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false

            - name: Install pnpm
              uses: pnpm/action-setup@5eea8caf49c844361c1e9ddc1324e179c54b58e9

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              env:
                  GALLERY_DL_AUTO_INSTALL: "false"
                  YOUTUBE_DL_SKIP_DOWNLOAD: "true"

            - name: Run checks
              run: pnpm run check

            - name: Audit production dependencies
              if: matrix.node == 22
              run: pnpm audit --prod --audit-level high

    version:
        name: Release metadata
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 24
            - run: node scripts/release.mjs validate

    container:
        name: Container build
        needs: test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false

            - name: Validate Compose configuration
              run: |
                  cp .env.example .env
                  docker compose config --quiet

            - name: Check Dockerfile
              run: docker build --check .

            - name: Build production image
              run: docker build --tag mediafilez:ci .

            - name: Verify downloader in production image
              run: docker run --rm --entrypoint sh mediafilez:ci -c 'test -x "$YTDLP_PATH" && "$YTDLP_PATH" --version'

    publish:
        name: Publish immutable image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: [test, container, version]
        runs-on: ubuntu-latest
        timeout-minutes: 25
        permissions:
            contents: read
            packages: write
        outputs:
            digest: ${{ steps.image.outputs.digest }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 24
            - id: version
              run: node scripts/release.mjs validate
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
              id: image
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: ghcr.io/rlxchap2/mediafilez:sha-${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.version.outputs.version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        name: Deploy and verify health
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            packages: read
            id-token: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 24
            - run: node scripts/deploy-client.mjs
              env:
                  DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
                  DEPLOY_ROLE: bot
                  IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    release:
        name: Publish verified release
        needs: [publish, deploy]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            packages: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: 24
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - run: node scripts/release.mjs publish
              env:
                  IMAGE_REPOSITORY: ghcr.io/rlxchap2/mediafilez
                  IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
