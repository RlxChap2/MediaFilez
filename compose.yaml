services:
  mediafilez:
    build: .
    container_name: mediafilez
    env_file:
      - .env
    environment:
      COBALT_API_ENDPOINTS: http://cobalt:9000
      GALLERY_DL_PATH: /usr/local/bin/gallery-dl
      YTDLP_PATH: /usr/local/bin/yt-dlp
    depends_on:
      - cobalt
    restart: unless-stopped
    init: true
    mem_limit: 768m
    memswap_limit: 1g
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    restart: unless-stopped
    init: true
    environment:
      API_URL: http://cobalt:9000/
    expose:
      - "9000"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
