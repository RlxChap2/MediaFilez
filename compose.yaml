services:
  mediafilez:
    build: .
    container_name: mediafilez
    env_file:
      - .env
    environment:
      COBALT_API_ENDPOINTS: ${COBALT_API_ENDPOINTS:-http://cobalt:9000,http://cobalt-community:9000}
      GALLERY_DL_PATH: /usr/local/bin/gallery-dl
      YTDLP_PATH: /usr/local/bin/yt-dlp
    depends_on:
      - cobalt
      - cobalt-community
    restart: unless-stopped
    init: true
    mem_limit: 768m
    memswap_limit: 1g
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cobalt:
    image: ghcr.io/imputnet/cobalt:11.7.1
    restart: unless-stopped
    init: true
    environment:
      API_URL: http://cobalt:9000/
    expose:
      - "9000"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cobalt-community:
    # zImPatrick/cobalt 11.7.1 at commit 56258ad. Keep the digest pinned.
    image: ghcr.io/zimpatrick/cobalt:staging@sha256:a4357be1523b1c2823873c53db0270c67e6f71856c4eaf22f8d62205da372bb8
    restart: unless-stopped
    init: true
    environment:
      API_URL: http://cobalt-community:9000/
    expose:
      - "9000"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
